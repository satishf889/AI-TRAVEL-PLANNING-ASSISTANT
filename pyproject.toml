[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-travel-planning-assistant"
version = "0.1.0"
description = "AI Travel Planning Assistant combining RAG and MCP tools for Singapore travel"
requires-python = ">=3.11"
authors = [{ name = "Satish Fulwani" }]
readme = "README.md"

[project.dependencies]
# This section is informational; install via requirements.txt in Docker

[tool.setuptools.packages.find]
where = ["."]
include = ["features*"]

# ─────────────────────────────────────────────
# Pytest configuration
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=features",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Integration tests (may call real services if configured)",
    "e2e: End-to-end tests covering full agent response",
    "rag: Tests related to the RAG pipeline",
    "mcp: Tests related to MCP tools",
    "orchestrator: Tests related to the LangChain orchestrator",
    "ui: Tests related to the Streamlit UI",
]

# ─────────────────────────────────────────────
# Ruff linter configuration
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["features", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "D",   # pydocstyle
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["features"]

# ─────────────────────────────────────────────
# Mypy configuration
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["langchain.*", "chromadb.*", "streamlit.*", "sentence_transformers.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────
# Coverage configuration
# ─────────────────────────────────────────────
[tool.coverage.run]
source = ["features"]
omit = ["tests/*", "scripts/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]

